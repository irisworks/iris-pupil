id: factorial-write
name: Agent writes a factorial function
description: Ask the agent to write a factorial function and verify the response contains a correct implementation.
tags:
  - code-gen
  - factorial
  - smoke
metadata:
  owner: dev

driver:
  type: rest
  preset: iris-http
  config:
    timeoutMs: 120000

input: Write a factorial function in Python that handles n=0.

expect:
  assertions:
    - type: contains
      target: response.text
      value: "def factorial"
    - type: regex
      target: response.text
      value: "factorial\\(0\\)|n == 0|n <= 1|n < 1"
      caseSensitive: false
    - type: contains
      target: response.text
      value: "return"
  thresholds:
    - metric: latency_ms
      max: 1000000
    - metric: cost_usd
      max: 0.05
  judge:
    enabled: true
    prompt: >
      The agent was asked to write a Python factorial function that handles n=0.
      Evaluate whether the response includes: a correct recursive or iterative
      implementation, a base case for 0 (returning 1), and runnable Python syntax.
      Select PASS if all of the following hold: returns 1 for n=0, handles
      positive integers correctly, uses valid Python syntax, and has no
      obvious off-by-one errors. Select NEEDS_REVIEW if the implementation is
      close but has a minor issue. Select FAIL if the function is missing,
      incorrect, or not valid Python.
    rubric:
      choices: [PASS, NEEDS_REVIEW, FAIL]
      choiceScores:
        PASS: pass
        NEEDS_REVIEW: needs_review
        FAIL: fail
