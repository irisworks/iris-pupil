scenarios: examples/scenarios

driver:
  type: rest
  preset: iris-http
  config:
    baseUrl: ${IRIS_BASE_URL:-http://127.0.0.1:3000}
    auth:
      type: bearer
      token: ${IRIS_API_TOKEN:-}

history:
  dir: .pupil

# Best-effort trace enrichment. `auto` enables it only when a host and both keys
# resolve; `false` disables it (so does `pupil run --no-langfuse`).
langfuse:
  enabled: auto
  host: ${LANGFUSE_HOST:-}
  publicKey: ${LANGFUSE_PUBLIC_KEY:-}
  secretKey: ${LANGFUSE_SECRET_KEY:-}
  # Langfuse ingests traces asynchronously; the runner counts scenario runtime
  # toward this initial delay before it starts polling.
  initialDelayMs: ${LANGFUSE_INITIAL_DELAY_MS:-8000}
  # Total trace lookup window, measured from scenario start when available.
  waitMs: ${LANGFUSE_WAIT_MS:-25000}

# target:
#   system: my-agent             # which agent (optional; namespaces a shared history store)
#   environment: ${DEPLOY_ENV:-} # staging | production | pr-123 (optional)
#   version: ${DEPLOY_SHA:-}     # git SHA, semver tag, or build ID — never a mutable label
#   mode: driven                 # always driven for pupil run; omit to use the default
#   fixtureSet: live             # live | stubbed-<name> (optional; guards against fixture contamination)
