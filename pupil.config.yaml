scenarios: examples/scenarios

driver:
  type: rest
  preset: iris-http
  config:
    baseUrl: ${IRIS_BASE_URL:-http://127.0.0.1:3000}
    auth:
      type: bearer
      token: ${IRIS_API_TOKEN:-}

history:
  dir: .pupil

# Best-effort trace enrichment. `auto` enables it only when a host and both keys
# resolve; `false` disables it (so does `pupil run --no-langfuse`).
langfuse:
  enabled: auto
  host: ${LANGFUSE_HOST:-}
  publicKey: ${LANGFUSE_PUBLIC_KEY:-}
  secretKey: ${LANGFUSE_SECRET_KEY:-}
  # Langfuse ingests traces asynchronously; how long to poll for one before skipping.
  waitMs: 10000

profiles:
  local:
    driver:
      config:
        baseUrl: ${IRIS_BASE_URL:-http://127.0.0.1:3000}
  staging:
    driver:
      config:
        baseUrl: ${IRIS_STAGING_BASE_URL:-http://127.0.0.1:3000}
  prod:
    driver:
      config:
        baseUrl: ${IRIS_PROD_BASE_URL:-http://127.0.0.1:3000}
