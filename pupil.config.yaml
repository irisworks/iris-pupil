scenarios: examples/scenarios

driver:
  type: rest
  preset: iris-http
  config:
    baseUrl: ${IRIS_BASE_URL:-http://127.0.0.1:3000}
    # Auth for the iris-http preset comes from the IRIS_API_TOKEN environment
    # variable or `pupil run --bearer-token`. Setting `bearerToken` here works
    # too, but only with a non-empty value.

history:
  dir: .pupil

# Best-effort trace enrichment. `auto` enables it only when a host and both keys
# resolve; `false` disables it (so does `pupil run --no-langfuse`).
langfuse:
  enabled: auto
  host: ${LANGFUSE_HOST:-}
  publicKey: ${LANGFUSE_PUBLIC_KEY:-}
  secretKey: ${LANGFUSE_SECRET_KEY:-}
  # Langfuse ingests traces asynchronously; the runner counts scenario runtime
  # toward this initial delay before it starts polling.
  initialDelayMs: ${LANGFUSE_INITIAL_DELAY_MS:-8000}
  # Total trace lookup window, measured from scenario start when available.
  waitMs: ${LANGFUSE_WAIT_MS:-25000}

# target:
#   system: my-agent             # which agent (optional; namespaces a shared history store)
#   environment: ${DEPLOY_ENV:-} # staging | production | pr-123 (optional)
#   version: ${DEPLOY_SHA:-}     # git SHA, semver tag, or build ID — never a mutable label
#   fixtureSet: live             # live | stubbed-<name> (optional; guards against fixture contamination)

# Regression thresholds for `pupil compare` and `pupil run --baseline`. Both
# commands read this block, so they always agree. `latencyThresholdPct` is a
# percent (20 means 20%) and defaults to 20 when unset. CLI flags override it.
compare:
  latencyThresholdPct: ${PUPIL_LATENCY_THRESHOLD_PCT:-20}

# Environment profiles: `pupil run --profile staging` deep-merges the named
# block over the blocks above. Only the selected profile is env-resolved, so an
# unset variable in a profile you are not running is not an error.
profiles:
  staging:
    driver:
      config:
        baseUrl: ${IRIS_STAGING_BASE_URL:-http://127.0.0.1:3000}
    target:
      environment: staging
  prod:
    driver:
      config:
        # No localhost fallback: an unset IRIS_PROD_BASE_URL should fail loudly
        # rather than silently pointing a "prod" run at localhost.
        baseUrl: ${IRIS_PROD_BASE_URL}
    target:
      environment: production
